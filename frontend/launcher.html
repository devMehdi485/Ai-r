<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>AI-R Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/launcher.css" />
</head>
<body>
  <div class="win-chrome">
    <!-- Titlebar -->
    <div class="win-titlebar">
      <div class="app-icon">A</div>
      <span class="win-title">AI-R Launcher <small>· v0.4.0</small></span>
      <div class="win-controls">
        <button title="Minimize"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M1 5h8"/></svg></button>
        <button title="Maximize"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="1" y="1" width="8" height="8"/></svg></button>
        <button class="close" title="Close"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.1"><path d="m1 1 8 8M9 1l-8 8"/></svg></button>
      </div>
    </div>

    <div class="body">
      <!-- LEFT -->
      <div class="left">
        <div>
          <h1 class="title-1">Configurer un vol</h1>
          <div class="subtitle">Choisis le mode et le drone à piloter.</div>
        </div>

        <div class="mode-toggle">
          <button class="mode-opt" data-mode="sim">
            <span class="ico"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.5" y="3.5" width="15" height="11" rx="1.5"/><path d="M2.5 14.5 17.5 14.5M7 17.5h6M10 14.5v3M5 7h10M5 10h6"/></svg></span>
            <span class="lbl"><b>Simulation</b><small>Drone virtuel</small></span>
          </button>
          <button class="mode-opt selected" data-mode="tello">
            <span class="ico"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="4" cy="4" r="2"/><circle cx="16" cy="4" r="2"/><circle cx="4" cy="16" r="2"/><circle cx="16" cy="16" r="2"/><path d="M5.5 5.5 9 9M14.5 5.5 11 9M5.5 14.5 9 11M14.5 14.5 11 11"/><rect x="8" y="8" width="4" height="4" rx="0.8"/></svg></span>
            <span class="lbl"><b>Tello</b><small>Drone physique</small></span>
          </button>
        </div>

        <div class="list-head">
          <div class="list-title">Mes drones <span class="count" id="drone-count">0</span></div>
          <button class="btn-add" id="btn-add">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10" stroke-linecap="round"/></svg>
            Ajouter
          </button>
        </div>

        <div class="drones" id="drones-list">
          <!-- généré par JS -->
        </div>

        <div class="sim-card" id="sim-card" style="display:none">
          <svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.5" y="3.5" width="15" height="11" rx="1.5"/><path d="M2.5 14.5 17.5 14.5M7 17.5h6M10 14.5v3M5 7h10M5 10h6"/></svg>
          <h3>Mode simulation actif</h3>
          <p>Aucun drone physique requis. Le simulateur charge un drone virtuel à l'origine (0,0,0).<br>La webcam du PC sert de "caméra du drone" pour tester YOLO.</p>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="right">
        <div class="right-body" id="right-body">
          <!-- Setup / details généré par JS -->
        </div>

        <div class="footer">
          <div class="footer-status">
            <span class="dot" id="footer-dot"></span>
            <span class="target" id="footer-target">Sélectionne un drone</span>
          </div>
          <button class="btn-start" id="btn-start" disabled>
            <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.5v9l8-4.5z"/></svg>
            Démarrer
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/launcher.js"></script>
</body>
</html>
